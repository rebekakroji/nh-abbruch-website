name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Warn if the contact form endpoint is missing
        if: ${{ vars.VITE_FORM_ENDPOINT == '' }}
        run: echo "::warning::Repository variable VITE_FORM_ENDPOINT is not set. The contact form will only open the visitor's mail client (mailto). See README."

      - name: Warn if the GA4 measurement ID is missing
        if: ${{ vars.VITE_GA_MEASUREMENT_ID == '' }}
        run: echo "::warning::Repository variable VITE_GA_MEASUREMENT_ID is not set. Google Analytics 4 stays disabled. See README."

      - name: Warn if the Google Ads tag ID is missing
        if: ${{ vars.VITE_GOOGLE_ADS_ID == '' }}
        run: echo "::warning::Repository variable VITE_GOOGLE_ADS_ID is not set. The Google Ads tag stays disabled. See README."

      # Der Build nutzt einen relativen Basispfad (vite.config.js) und prüft danach die Pfade in dist/
      # (scripts/check-dist.mjs) sowie die Consent-Mode-/GA4-/Ads-Konsistenz (scripts/check-consent.mjs).
      - run: npm run build
        env:
          # Optional: Endpunkt des Formular-Dienstes (Repository -> Settings -> Secrets and variables -> Actions -> Variables)
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          # Optional: GA4-Measurement-ID, wird erst nach Cookie-Einwilligung geladen (Repository -> Settings -> Secrets and variables -> Actions -> Variables)
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          # Optional: Google-Ads-Tag-ID, wird erst nach Cookie-Einwilligung (Marketing) geladen (Repository -> Settings -> Secrets and variables -> Actions -> Variables)
          VITE_GOOGLE_ADS_ID: ${{ vars.VITE_GOOGLE_ADS_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
