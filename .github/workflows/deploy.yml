name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Warn if the contact form endpoint is missing
        if: ${{ vars.VITE_FORM_ENDPOINT == '' }}
        run: echo "::warning::Repository variable VITE_FORM_ENDPOINT is not set. The contact form will only open the visitor's mail client (mailto). See README."

      # Der Build nutzt einen relativen Basispfad (vite.config.js) und prüft danach die Pfade in dist/ (scripts/check-dist.mjs).
      - run: npm run build
        env:
          # Optional: Endpunkt des Formular-Dienstes (Repository -> Settings -> Secrets and variables -> Actions -> Variables)
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
